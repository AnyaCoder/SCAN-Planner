/**:
  ros__parameters:
    prior_map_file: ""
    map_frame: world
    local_frame: fastlio_world

    input_vehicle_topic: /LIO/odom_vehicle
    input_imu_topic: /LIO/odom_imu
    input_cloud_topic: /LIO/clouds_lidar
    initial_pose_topic: /initialpose

    output_vehicle_topic: /LIO/relocalized/odom_vehicle
    output_imu_topic: /LIO/relocalized/odom_imu
    status_topic: /relocalization/status
    fitness_topic: /relocalization/fitness
